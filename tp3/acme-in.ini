; R505 TP3 - IN-CSE
; Configuration adaptée à ACME 2026.05.x

[basic.config]
cseType=IN
cseID=id-in
cseName=cse-in
serviceProviderID=//acme.example.com
adminID=CAdmin
networkInterface=0.0.0.0
cseHost=127.0.0.1
httpPort=8080
databaseType=memory
logLevel=debug
consoleTheme=dark
consoleType=rich

[http]
enable=true
enableManagementEndpoint=true
enableStructureEndpoint=true
enableUpperTesterEndpoint=true

[textui]
enable=false
startWithTUI=false

[webui]
enable=true

[cse.operation.requests]
enable=true

[cse.registration]
; La version actuelle d'ACME attend les CSE-ID sans "/" initial ici.
allowedCSROriginators=id-mn,id-asn
