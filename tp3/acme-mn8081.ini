; R505 TP3 - MN-CSE enregistré sur le IN-CSE
; Configuration adaptée à ACME 2026.05.x

[basic.config]
cseType=MN
cseID=id-mn
cseName=cse-mn
serviceProviderID=//acme.example.com
adminID=CAdmin
networkInterface=0.0.0.0
cseHost=127.0.0.1
httpPort=8081
databaseType=memory
logLevel=debug
consoleTheme=dark
consoleType=rich
registrarCseID=id-in
registrarCseName=cse-in
registrarCseHost=127.0.0.1
registrarCsePort=8080

[http]
enable=true
enableManagementEndpoint=true
enableStructureEndpoint=true
enableUpperTesterEndpoint=true

[textui]
enable=false
startWithTUI=false

[webui]
enable=true

[cse.operation.requests]
enable=true

[cse.registration]
allowedCSROriginators=id-asn
